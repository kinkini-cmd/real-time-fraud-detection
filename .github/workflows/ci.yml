name: Fraud Detection CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.9, 3.10, 3.11]
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Lint with flake8
      run: |
        pip install flake8
        flake8 src tests --count --show-source --statistics
    
    - name: Train model
      run: |
        python -m src.models.train
    
    - name: Run tests
      run: |
        pytest tests/ -v --cov=src --cov-report=term-missing
    
    - name: Upload model artifact
      uses: actions/upload-artifact@v3
      with:
        name: fraud-model
        path: models/

  build-docker:
    needs: test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Build Docker image
      run: |
        docker build -t fraud-detection:${{ github.sha }} .
        docker tag fraud-detection:${{ github.sha }} fraud-detection:latest
    
    - name: Test Docker image
      run: |
        docker run --rm fraud-detection:latest python -c "from src.api.main import app; print('Docker image test passed')"